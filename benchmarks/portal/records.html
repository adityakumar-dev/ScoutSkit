<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Records</title></head>
<body>
  <h1>Records</h1>
  <label>Show
    <select id="size" aria-label="Show entries"><option>10</option><option>20</option><option>50</option></select>
    entries</label>
  <table id="t">
    <thead><tr><th>ID</th><th>Title</th><th>Category</th></tr></thead>
    <tbody></tbody>
  </table>
  <nav aria-label="Pagination">
    <button id="prev">Previous</button>
    <span id="info"></span>
    <button id="next">Next</button>
  </nav>
  <script src="data.js"></script>
  <script>
    let page = 0;
    const size = () => parseInt(document.getElementById('size').value, 10);
    function render() {
      const s = size(), start = page * s, rows = DATA.slice(start, start + s);
      document.querySelector('#t tbody').innerHTML = rows.map(r => `<tr><td>${r.id}</td><td>${r.title}</td><td>${r.category}</td></tr>`).join('');
      document.getElementById('info').textContent = `Showing ${start + 1} to ${start + rows.length} of ${DATA.length} entries`;
      document.getElementById('prev').disabled = page === 0;
      document.getElementById('next').disabled = start + s >= DATA.length;
    }
    document.getElementById('size').onchange = () => { page = 0; render(); };
    document.getElementById('prev').onclick = () => { page--; render(); };
    document.getElementById('next').onclick = () => { page++; render(); };
    render();
  </script>
</body>
</html>
