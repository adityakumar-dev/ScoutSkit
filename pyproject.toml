[project]
name = "scoutskit"
version = "0.1.0"
description = "ScoutsKit: an autonomous web-task agent that keeps evidence and replays what worked without a model"
readme = "README.md"
authors = [
    { name = "adityakumar-dev", email = "adityakumar.devxlinux@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.21",
    "lxml>=6.1.3",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scoutskit = "scoutskit.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
